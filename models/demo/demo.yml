version: 2

models:
  - name: employee
    description: "Employee DBT model"
    columns:
      - name: emp_id
        data_tests:
          - unique
          - not_null
          - accepted_values:
              arguments:
                values: ['1', '2', '3', '4','5']
                config:
                  severity: warn 
      - name: emp_salary
        data_tests:
          - salary_check
      - name: customer
        description: "DBT model for the customer tabele"
      - name: customer_vw
        description: "DBT model for customer view"
      - name: sales
        description: "DBT model for sales table"
      - name: product
        description: "DBT model for product table"
      - name: purchase
        description: "DBT model for purchase table"
      - name: clean_orders
        description: "DBT model for clean ephemeral table"
      - name: final_orders
        description: "DBT model for final table"
      - name: session
        description: "DBT model for session table"
      - name: concat_name
        description: "DBT model for concat name"
      - name: concat_address
        description: "DBT model for concat address"
sources:
  - name: employee
    database: DBT_DB
    schema: PUBLIC
    tables:
      - name: EMPLOYEE_RAW
  - name: customer
    database: DBT_DB
    schema: PUBLIC
    tables:
      - name: CUSTOMER_SRC
  - name: sales
    database: DBT_DB
    schema: PUBLIC
    tables:
      - name: SALES_SRC
  - name: product
    database: DBT_DB
    schema: PUBLIC
    tables:
      - name: PRODUCT_SRC
  - name: purchase
    database: DBT_DB
    schema: PUBLIC
    tables:
      - name: PURCHASE_SRC
  - name: orders
    database: DBT_DB
    schema: PUBLIC
    tables:
      - name: BASE_ORDERS
  - name: patient
    database: DBT_DB
    schema: PUBLIC
    tables:
      - name: PATIENT_SRC
  - name: session
    database: DBT_DB
    schema: PUBLIC
    tables:
      - name: SESSION_SRC
